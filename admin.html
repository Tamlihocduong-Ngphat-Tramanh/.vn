<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thống Quản Lý - Admin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: #f4f6f9; color: #333; padding: 30px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
.container { width: 100%; max-width: 1000px; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
h2 { color: #2c3e50; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 24px; border-bottom: 2px solid #eee; padding-bottom: 10px; flex-wrap: wrap; gap: 15px; }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; }
.btn-refresh { background: #0dc6de; color: white; }
.btn-refresh:hover { background: #0cb1c7; }
.btn-excel { background: #2e7d32; color: white; }
.btn-excel:hover { background: #1b5e20; }
.btn-danger { background: #d32f2f; color: white; }
.btn-danger:hover { background: #c62828; }
.table-responsive { width: 100%; overflow-x: auto; margin-top: 20px; border: 1px solid #e0e0e0; border-radius: 8px; }
table { width: 100%; border-collapse: collapse; text-align: left; min-width: 700px; }
th, td { padding: 14px; border-bottom: 1px solid #e0e0e0; font-size: 15px; }
th { background: #f8f9fa; color: #555; font-weight: 600; }
tr:hover { background: #fdfdfd; }
.id-text { color: #0d6efd; font-weight: bold; }

/* Thao tác đăng nhập mật khẩu admin */
.lock-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:#2c3e50; display:flex; justify-content:center; align-items:center; z-index:9999; }
.lock-box { background: white; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 360px; }
.lock-box h3 { margin-bottom: 20px; color: #333; }
.lock-box input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; outline: none; font-size: 16px; text-align: center; }
.lock-box button { width: 100%; padding: 12px; background: #0d6efd; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
</style>
</head>
<body>

<div id="lockScreen" class="lock-screen">
    <div class="lock-box">
        <h3>🔑 TRUY CẬP ADMIN</h3>
        <input type="password" id="adminPassword" placeholder="Nhập mật khẩu quản trị" onkeypress="handleKeyPress(event)">
        <button onclick="checkPassword()">Xác nhận vào hệ thống</button>
    </div>
</div>

<div class="container" id="mainContent" style="display: none;">
    <h2>
        <span>📊 Danh Sách Học Sinh Tham Gia</span>
        <div class="btn-group">
            <button class="btn btn-refresh" onclick="refreshData()">🔄 Làm mới dữ liệu</button>
            <button class="btn btn-excel" onclick="exportToCSV()">📥 Xuất File Excel (CSV)</button>
            <button class="btn btn-danger" onclick="clearAllData()">💥 Xóa dữ liệu & Đặt lại ID</button>
        </div>
    </h2>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Mã số ID</th>
                    <th>Họ và Tên</th>
                    <th>Thành phố (Nơi ở)</th>
                    <th>Tuổi</th>
                    <th>Tên Trường</th>
                    <th>Lớp</th>
                    <th>Giới tính</th>
                    <th>Thời gian đăng nhập</th>
                </tr>
            </thead>
            <tbody id="adminTableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
// Cài đặt mật khẩu Admin tại đây
const SECRET_PASSWORD = "admin123";

function handleKeyPress(e) {
    if (e.key === 'Enter') checkPassword();
}

function checkPassword() {
    let enteredPassword = document.getElementById("adminPassword").value;
    if(enteredPassword === SECRET_PASSWORD) {
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        renderAdminData();
    } else {
        alert("❌ Mật khẩu chưa chính xác. Vui lòng kiểm tra lại!");
    }
}

function renderAdminData() {
    let userList = JSON.parse(localStorage.getItem("userList") || "[]");
    let tbody = document.getElementById("adminTableBody");
    tbody.innerHTML = "";

    if(userList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#888; padding: 30px;">Chưa có dữ liệu học sinh tham gia đăng nhập trên thiết bị này.</td></tr>`;
        return;
    }

    userList.forEach(user => {
        let row = `<tr>
            <td class="id-text">${user.id}</td>
            <td>${user.name}</td>
            <td>${user.city}</td>
            <td>${user.age} tuổi</td>
            <td>${user.school}</td>
            <td>Lớp ${user.class}</td>
            <td>${user.gender}</td>
            <td>${user.loginTime}</td>
        </tr>`;
        tbody.innerHTML += row;
    });
}

// Hàm làm mới dữ liệu mà không cần load lại trang
function refreshData() {
    renderAdminData();
    
    // Hiệu ứng thông báo nhỏ góc màn hình hoặc thông báo nhanh cho Admin biết
    let btn = document.querySelector('.btn-refresh');
    btn.style.opacity = '0.6';
    btn.textContent = '⌛ Đang cập nhật...';
    
    setTimeout(() => {
        btn.style.opacity = '1';
        btn.textContent = '🔄 Làm mới dữ liệu';
    }, 400);
}

// Hàm tải danh sách xuống thành file Excel (CSV) có xử lý tiếng Việt BOM
function exportToCSV() {
    let userList = JSON.parse(localStorage.getItem("userList") || "[]");
    if(userList.length === 0) { alert("Không có dữ liệu để xuất!"); return; }

    let csvContent = "\uFEFF"; // Ký tự BOM giúp Excel mở không bị lỗi font Tiếng Việt
    csvContent += "Mã số ID,Họ và Tên,Nơi ở,Tuổi,Tên Trường,Lớp,Giới tính,Thời gian đăng nhập\n";

    userList.forEach(u => {
        csvContent += `"${u.id}","${u.name}","${u.city}","${u.age}","${u.school}","Lớp ${u.class}","${u.gender}","${u.loginTime}"\n`;
    });

    let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    let link = document.createElement("a");
    let url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    link.setAttribute("download", `Danh_sach_hoc_sinh_${new Date().toLocaleDateString('vi-VN')}.csv`);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function clearAllData() {
    if(confirm("⚠️ CẢNH BÁO: Hành động này sẽ XÓA TOÀN BỘ danh sách học sinh lưu trên máy và đưa số đếm ID quay lại từ đầu (HS001). Bạn có chắc chắn không?")) {
        localStorage.removeItem("user");
        localStorage.removeItem("userList");
        localStorage.removeItem("studentCount");
        alert("Đã làm sạch toàn bộ dữ liệu thành công!");
        renderAdminData();
    }
}
</script>
</body>
</html>
